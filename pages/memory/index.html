<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>记忆</title>
    <!-- 主动引入宿主桥：AstrBot 会给这行补上访问令牌，并且因为已存在就不再往
         文档末尾重复注入——注入在末尾的话，会晚于本页的内联脚本执行。 -->
    <script src="/api/plugin/page/bridge-sdk.js"></script>
    <style>
      :root {
        --bg: #f6f7f9;
        --card: #ffffff;
        --text: #1f2329;
        --muted: #8a9099;
        --line: #e5e6eb;
        --accent: #4d7cfe;
        --accent-soft: rgba(77, 124, 254, 0.12);
        --warn: #d9822b;
        --warn-soft: rgba(217, 130, 43, 0.14);
        --ok: #2f9e6f;
        --ok-soft: rgba(47, 158, 111, 0.14);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1a1d21;
          --card: #232629;
          --text: #e6e8ea;
          --muted: #8b9199;
          --line: #33373c;
          --accent: #6b91ff;
          --accent-soft: rgba(107, 145, 255, 0.18);
          --warn: #e0a05a;
          --warn-soft: rgba(224, 160, 90, 0.18);
          --ok: #4cc38a;
          --ok-soft: rgba(76, 195, 138, 0.18);
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 20px;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.6 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
      }
      .head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 16px;
      }
      .head h1 { font-size: 18px; margin: 0; font-weight: 600; }
      button {
        font: inherit;
        color: var(--text);
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 6px 14px;
        cursor: pointer;
      }
      button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
      button:disabled { opacity: 0.45; cursor: default; }
      .stats {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
        gap: 10px;
        margin-bottom: 16px;
      }
      .sleep-bar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px;
        padding: 10px 14px;
        margin-bottom: 16px;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 10px;
        color: var(--muted);
        font-size: 13px;
      }
      .stat {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 12px 14px;
      }
      .stat .num { font-size: 20px; font-weight: 600; }
      .stat .cap { color: var(--muted); font-size: 12px; }
      .tabs {
        display: flex;
        gap: 6px;
        margin-bottom: 12px;
        flex-wrap: wrap;
      }
      .tabs button.active {
        color: var(--accent);
        border-color: var(--accent);
        background: var(--accent-soft);
      }
      .filters {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-bottom: 12px;
        flex-wrap: wrap;
      }
      select {
        font: inherit;
        color: var(--text);
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 6px 10px;
        max-width: 320px;
      }
      .item {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 12px 14px;
        margin-bottom: 8px;
      }
      .meta {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        color: var(--muted);
        font-size: 12px;
        margin-bottom: 6px;
      }
      .who { color: var(--text); font-weight: 600; }
      .who.self { color: var(--accent); }
      .body { white-space: pre-wrap; word-break: break-word; }
      .caption {
        margin-top: 6px;
        padding: 6px 10px;
        border-radius: 8px;
        background: var(--accent-soft);
        color: var(--accent);
        font-size: 12px;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .tags { color: var(--muted); font-size: 12px; margin-top: 6px; }
      .quote {
        margin-top: 6px;
        padding-left: 10px;
        border-left: 2px solid var(--line);
        color: var(--muted);
        font-size: 12px;
        white-space: pre-wrap;
      }
      .badge {
        padding: 1px 8px;
        border-radius: 999px;
        background: var(--accent-soft);
        color: var(--accent);
      }
      .badge.warn { background: var(--warn-soft); color: var(--warn); }
      .badge.ok { background: var(--ok-soft); color: var(--ok); }
      .pager {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        margin-top: 16px;
        color: var(--muted);
      }
      .empty, .status {
        text-align: center;
        color: var(--muted);
        padding: 24px 0;
      }
      .status.error { color: var(--warn); }
      .hidden { display: none; }
      .hint { color: var(--muted); font-size: 12px; }
      .actions {
        display: flex;
        gap: 8px;
        margin-top: 10px;
        flex-wrap: wrap;
      }
      .actions button { padding: 4px 12px; font-size: 13px; }
      .actions button.danger { color: var(--warn); border-color: var(--warn); }
      .actions button.primary { color: var(--accent); border-color: var(--accent); }
      textarea {
        width: 100%;
        min-height: 90px;
        font: inherit;
        color: var(--text);
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 8px 10px;
        resize: vertical;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
        gap: 8px;
      }
      .param {
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 8px 10px;
        font-size: 13px;
      }
      .param .k { color: var(--muted); font-size: 12px; }
      .param .v { font-weight: 600; }
      .section-title { font-size: 14px; font-weight: 600; margin: 18px 0 8px; }
      .section-title.first { margin-top: 0; }
    </style>
  </head>
  <body>
    <div class="head">
      <h1>什亭之枢 · 记忆</h1>
      <button id="refresh">刷新</button>
    </div>

    <div class="stats" id="stats"></div>
    <div class="sleep-bar hidden" id="sleep-bar"></div>

    <div class="tabs" id="tabs">
      <button data-tab="short" class="active">短期账本</button>
      <button data-tab="long">长期记忆</button>
      <button data-tab="permanent">永久记忆</button>
      <button data-tab="profiles">用户画像</button>
      <button data-tab="runtime">巡检与焦点</button>
      <button data-tab="context">当前上下文</button>
    </div>

    <div class="filters" id="filters">
      <select id="chat-filter"><option value="">全部会话</option></select>
    </div>

    <div class="filters hidden" id="context-filters">
      <select id="context-chat"><option value="">选择会话</option></select>
      <span class="hint">这里显示该会话最近一次请求真正发给主脑的内容。</span>
    </div>

    <main id="list"></main>

    <div class="pager hidden" id="pager">
      <button id="prev">上一页</button>
      <span id="pageinfo"></span>
      <button id="next">下一页</button>
    </div>

    <div class="status" id="status">载入中…</div>

    <script>
      const PLUGIN = "astrbot_plugin_shittim";
      const PAGE_LIMIT = 50;

      const state = { tab: "short", chatId: "", offset: 0, total: 0, contextChatId: "" };

      const el = {
        stats: document.getElementById("stats"),
        sleepBar: document.getElementById("sleep-bar"),
        tabs: document.getElementById("tabs"),
        filters: document.getElementById("filters"),
        chatFilter: document.getElementById("chat-filter"),
        contextFilters: document.getElementById("context-filters"),
        contextChat: document.getElementById("context-chat"),
        list: document.getElementById("list"),
        pager: document.getElementById("pager"),
        pageInfo: document.getElementById("pageinfo"),
        prev: document.getElementById("prev"),
        next: document.getElementById("next"),
        status: document.getElementById("status"),
        refresh: document.getElementById("refresh"),
      };

      // 宿主桥由 AstrBot 注入。这里不缓存引用，并在需要时等它出现：桥的注入
      // 位置不由本页决定，缓存早了就会一路走下面的回退分支。
      function getBridge() {
        return (typeof window !== "undefined" && window.AstrBotPluginPage) || null;
      }

      async function waitForBridge(timeoutMs = 1000) {
        const deadline = Date.now() + timeoutMs;
        for (;;) {
          const bridge = getBridge();
          if (bridge) return bridge;
          if (Date.now() >= deadline) return null;
          await new Promise((resolve) => setTimeout(resolve, 30));
        }
      }

      async function apiGet(path, params) {
        const bridge = await waitForBridge();
        if (bridge) {
          // 插件页是 sandbox 的 opaque origin，自己发请求必被 401 挡下，
          // 只能交给宿主代发（它带着 dashboard 的鉴权）。
          await bridge.ready();
          return await bridge.apiGet(path, params || {});
        }
        // 直接打开这个 HTML 独立调试时才会走到这里，正常在插件页里走不到
        const url = new URL(`/api/plug/${PLUGIN}/${path}`, location.origin);
        Object.entries(params || {}).forEach(([key, value]) => {
          if (value !== undefined && value !== null && value !== "") {
            url.searchParams.set(key, String(value));
          }
        });
        const resp = await fetch(url.toString(), { credentials: "include" });
        const body = await resp.json();
        if (body && body.status === "error") throw new Error(body.message || "请求失败");
        return body && "data" in body ? body.data : body;
      }

      async function apiPost(path, body) {
        const bridge = await waitForBridge();
        if (bridge) {
          await bridge.ready();
          if (typeof bridge.apiPost !== "function") {
            throw new Error("当前 AstrBot 版本不支持页面写操作，请升级后再试");
          }
          const result = await bridge.apiPost(path, body || {});
          if (result && result.status === "error") {
            throw new Error(result.message || "请求失败");
          }
          return result && "data" in result ? result.data : result;
        }
        const url = new URL(`/api/plug/${PLUGIN}/${path}`, location.origin);
        const resp = await fetch(url.toString(), {
          method: "POST",
          credentials: "include",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body || {}),
        });
        const payload = await resp.json();
        if (payload && payload.status === "error") throw new Error(payload.message || "请求失败");
        return payload && "data" in payload ? payload.data : payload;
      }

      function fmtSeconds(sec) {
        const value = Math.max(Number(sec) || 0, 0);
        if (value < 60) return `${value.toFixed(1)} 秒`;
        if (value < 3600) return `${Math.round(value / 60)} 分钟`;
        return `${(value / 3600).toFixed(1)} 小时`;
      }

      function fmtTime(ts) {
        if (!ts) return "—";
        const d = new Date(ts * 1000);
        const pad = (n) => String(n).padStart(2, "0");
        return `${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
      }

      function fmtAge(ts) {
        if (!ts) return "";
        const sec = Math.max(Date.now() / 1000 - ts, 0);
        if (sec < 60) return "刚刚";
        if (sec < 3600) return `${Math.floor(sec / 60)}分钟前`;
        if (sec < 86400) return `${Math.floor(sec / 3600)}小时前`;
        return `${Math.floor(sec / 86400)}天前`;
      }

      function fmtClock(ts) {
        if (!ts) return "—";
        const d = new Date(ts * 1000);
        const pad = (n) => String(n).padStart(2, "0");
        return `${pad(d.getHours())}:${pad(d.getMinutes())}`;
      }

      function tag(text, cls) {
        const span = document.createElement("span");
        span.className = "badge" + (cls ? " " + cls : "");
        span.textContent = text;
        return span;
      }

      function line(text, cls) {
        const span = document.createElement("span");
        if (cls) span.className = cls;
        span.textContent = text;
        return span;
      }

      function setStatus(text, isError) {
        el.status.textContent = text || "";
        el.status.className = "status" + (isError ? " error" : "");
        el.status.classList.toggle("hidden", !text);
      }

      function renderStats(data) {
        el.stats.replaceChildren();
        const cards = [
          ["短期消息", data.short_term],
          ["短期摘要", data.summaries],
          ["活跃会话", data.chats],
          ["长期记忆", data.long],
          ["永久记忆", data.permanent],
          ["用户画像", data.profiles],
          ["关注中会话", data.focused],
        ];
        cards.forEach(([cap, num]) => {
          const box = document.createElement("div");
          box.className = "stat";
          const n = document.createElement("div");
          n.className = "num";
          n.textContent = String(num ?? 0);
          const c = document.createElement("div");
          c.className = "cap";
          c.textContent = cap;
          box.append(n, c);
          el.stats.appendChild(box);
        });
        renderSleepBar(data.sleep);
      }

      // 作息条：阶段 + 本轮入睡/起床 + 推迟量 + 上次整理。
      // 阶段是后端现算的（phase_at 纯函数），页面不自己推。
      function renderSleepBar(sleep) {
        if (!sleep) {
          el.sleepBar.replaceChildren();
          el.sleepBar.classList.add("hidden");
          return;
        }
        const nodes = [];
        nodes.push(tag(sleep.phase_label || sleep.phase, sleep.phase === "awake" ? "ok" : ""));
        nodes.push(line(`${fmtClock(sleep.sleep_at)} 入睡 / ${fmtClock(sleep.wake_at)} 起床`));
        if (sleep.postponed_hours > 0) {
          nodes.push(line(`（本轮推迟 ${sleep.postponed_hours} 小时）`));
        }
        nodes.push(
          line(
            sleep.last_curation_at
              ? `上次整理 ${fmtAge(sleep.last_curation_at)}`
              : "尚未整理过"
          )
        );
        el.sleepBar.replaceChildren(...nodes);
        el.sleepBar.classList.remove("hidden");
      }

      function renderChats(chats) {
        const current = el.chatFilter.value;
        el.chatFilter.replaceChildren();
        const all = document.createElement("option");
        all.value = "";
        all.textContent = "全部会话";
        el.chatFilter.appendChild(all);
        chats.forEach((chat) => {
          const option = document.createElement("option");
          option.value = chat.chat_id;
          option.textContent = `${chat.chat_label || chat.chat_id}（${chat.message_count}）`;
          el.chatFilter.appendChild(option);
        });
        el.chatFilter.value = current;
      }

      // 摘要块排在最前：时间线里它们也代表「更早的那一段」，顺序必须一致
      function renderShortTerm(items, summaries) {
        el.list.replaceChildren();
        (summaries || []).forEach((item) => {
          const box = document.createElement("div");
          box.className = "item";
          const meta = document.createElement("div");
          meta.className = "meta";
          meta.appendChild(tag("更早的一段概括", "ok"));
          meta.appendChild(line(`${item.covered_count} 条压成 1 条`));
          meta.appendChild(line(`覆盖到 ${fmtTime(item.covered_at)}`));
          const body = document.createElement("div");
          body.className = "body";
          body.textContent = item.content;
          box.append(meta, body);
          el.list.appendChild(box);
        });
        if (!items.length) {
          if (!(summaries || []).length) {
            el.list.appendChild(emptyNode("这片记忆还是空的"));
          }
          return;
        }
        items.forEach((item) => {
          const box = document.createElement("div");
          box.className = "item";
          const meta = document.createElement("div");
          meta.className = "meta";
          meta.appendChild(line(item.chat_label || item.chat_id));
          meta.appendChild(
            line(
              item.role === "assistant" ? "爱丽丝" : item.sender_name || item.sender_id || "某人",
              "who" + (item.role === "assistant" ? " self" : "")
            )
          );
          meta.appendChild(line(`${fmtTime(item.created_at)} · ${fmtAge(item.created_at)}`));
          if (item.gated) {
            meta.appendChild(tag("主脑看不到", "warn"));
          }
          if (item.source === "sleep") {
            meta.appendChild(tag("睡觉时收到"));
          }
          if (item.staged) {
            meta.appendChild(tag("醒来才入账", "warn"));
          }
          const body = document.createElement("div");
          body.className = "body";
          body.textContent = item.content;
          box.append(meta, body);
          if (item.image_caption) {
            const caption = document.createElement("div");
            caption.className = "caption";
            caption.textContent = `图片内容：${item.image_caption}`;
            box.appendChild(caption);
          }
          if (item.forward_content) {
            const forwarded = document.createElement("div");
            forwarded.className = "caption";
            forwarded.textContent = `转发内容：${item.forward_content}`;
            box.appendChild(forwarded);
          }
          el.list.appendChild(box);
        });
      }

      function renderMemories(items) {
        el.list.replaceChildren();
        if (!items.length) {
          el.list.appendChild(emptyNode("这层还没有记忆"));
          return;
        }
        items.forEach((item) => {
          const box = document.createElement("div");
          box.className = "item";
          const meta = document.createElement("div");
          meta.className = "meta";
          meta.appendChild(tag(item.tier === "permanent" ? "永久" : "长期"));
          if (item.tier === "permanent") {
            meta.appendChild(line("确信的事，不参与榜序"));
          } else {
            meta.appendChild(line(`第 ${item.rank} / ${item.rank_total} 位`));
            meta.appendChild(tag(item.level_label, item.level === 0 ? "ok" : "warn"));
            if (item.promoted_at) {
              meta.appendChild(line(`最近想起 ${fmtAge(item.promoted_at)}`));
            }
          }
          meta.appendChild(line(`${fmtTime(item.created_at)} · ${fmtAge(item.created_at)}`));
          meta.appendChild(tag(`召回 ${item.recall_count} 次`));
          if (item.cross_chat_count > 1) {
            meta.appendChild(tag(`跨 ${item.cross_chat_count} 个会话`));
          }
          if (item.manual) {
            meta.appendChild(tag("手动记住", "ok"));
          }
          if (item.chat_label) {
            meta.appendChild(line(`来自 ${item.chat_label}`));
          }
          const body = document.createElement("div");
          body.className = "body";
          body.textContent = item.content;
          box.append(meta, body);

          const words = [...(item.tags || []), ...(item.keywords || [])];
          if (words.length) {
            const tags = document.createElement("div");
            tags.className = "tags";
            tags.textContent = words.map((word) => `#${word}`).join(" ");
            box.appendChild(tags);
          }
          if (item.source_quote) {
            const quote = document.createElement("div");
            quote.className = "quote";
            quote.textContent = `原话：${item.source_quote}`;
            box.appendChild(quote);
          }
          // 手工维护：正文由编辑框直接改写，删除会同时抑制它被重新压缩回来
          const actions = document.createElement("div");
          actions.className = "actions";
          const editButton = document.createElement("button");
          editButton.textContent = "编辑";
          editButton.addEventListener("click", () => startEdit(body, actions, item));
          const deleteButton = document.createElement("button");
          deleteButton.className = "danger";
          deleteButton.textContent = "删除";
          deleteButton.addEventListener("click", () => deleteMemory(item));
          actions.append(editButton, deleteButton);
          box.appendChild(actions);
          el.list.appendChild(box);
        });
      }

      // 用户画像：一行就是一个人。身份是「平台 + QQ 号」，所以私聊与群聊
      // 共用同一张卡片；aliases 里是他用过的不同名字。
      function renderProfiles(items) {
        el.list.replaceChildren();
        if (!items.length) {
          el.list.appendChild(
            emptyNode("还没有用户画像。聊过一段时间、整理过一次记忆后，这里会逐渐出现对每个人的印象。")
          );
          return;
        }
        items.forEach((item) => {
          const box = document.createElement("div");
          box.className = "item";
          const meta = document.createElement("div");
          meta.className = "meta";
          meta.appendChild(line(item.display_name || item.user_id, "who"));
          meta.appendChild(tag(`QQ ${item.user_id}`));
          if (item.message_count) {
            meta.appendChild(tag(`${item.message_count} 条发言`));
          }
          if (item.platform) {
            meta.appendChild(line(item.platform));
          }
          if (item.last_seen) {
            meta.appendChild(line(`最近说话 ${fmtAge(item.last_seen)}`));
          }
          box.appendChild(meta);

          if (item.aliases && item.aliases.length) {
            const aliases = document.createElement("div");
            aliases.className = "tags";
            aliases.textContent = `用过的名字：${item.aliases.join(" / ")}`;
            box.appendChild(aliases);
          }

          const body = document.createElement("div");
          body.className = "body";
          body.textContent =
            item.summary || "（还没有形成描述；整理记忆后会逐渐完善）";
          box.appendChild(body);

          if (item.keywords && item.keywords.length) {
            const words = document.createElement("div");
            words.className = "tags";
            words.textContent = item.keywords.map((word) => `#${word}`).join(" ");
            box.appendChild(words);
          }

          const foot = document.createElement("div");
          foot.className = "meta";
          foot.appendChild(
            line(
              item.profiled_at
                ? `画像更新于 ${fmtAge(item.profiled_at)}`
                : "画像尚未整理"
            )
          );
          if (item.first_seen) {
            foot.appendChild(line(`首次见面 ${fmtTime(item.first_seen)}`));
          }
          box.appendChild(foot);
          el.list.appendChild(box);
        });
      }

      function paramBox(key, value) {
        const box = document.createElement("div");
        box.className = "param";
        const k = document.createElement("div");
        k.className = "k";
        k.textContent = key;
        const v = document.createElement("div");
        v.className = "v";
        v.textContent = String(value);
        box.append(k, v);
        return box;
      }

      function sectionTitle(text) {
        const div = document.createElement("div");
        div.className = "section-title";
        div.textContent = text;
        return div;
      }

      function textBlock(text) {
        const box = document.createElement("div");
        box.className = "item";
        const body = document.createElement("div");
        body.className = "body";
        body.textContent = text || "（空）";
        box.appendChild(body);
        return box;
      }

      const FOCUS_STATUS = { focused: "关注中", left: "已离开", expired: "已超时" };
      const VERDICT_LABEL = {
        reply: "开口",
        silent: "沉默",
        superseded: "被新消息取代",
        cooldown: "冷却拦下",
        release: "静默放行",
        skipped: "未判定",
      };
      const ENTRY_KIND = {
        history: "原生历史",
        timeline: "账本时间线",
        injected: "注入块",
        persona: "人格预设对话",
      };
      const ROLE_LABEL = { user: "用户", assistant: "你", system: "系统", tool: "工具" };

      // 巡检与焦点：上面是配置参数，下面是此刻真正在等的窗口 / 判定 / 冷却。
      // 参数与运行时状态放在一起，才能回答「为什么这句话没被放行」。
      function renderRuntime(data) {
        el.list.replaceChildren();
        const dec = data.decision || {};
        const focusCfg = data.focus_config || {};

        el.list.appendChild(sectionTitle("巡检参数"));
        const grid = document.createElement("div");
        grid.className = "grid";
        [
          ["接管对话", dec.enabled ? "开" : "关"],
          ["群聊巡检", dec.patrol_enabled ? "开" : "关"],
          ["巡检窗口静默时长", `${dec.patrol_window_seconds} 秒`],
          ["判为不回后的冷却", fmtSeconds(dec.patrol_cooldown_seconds)],
          ["噪声预过滤", dec.patrol_noise_filter ? "开" : "关"],
          ["私聊与 @ 防抖", `${dec.private_debounce_seconds} 秒`],
          [
            "防抖最长等待",
            dec.private_debounce_max_seconds > 0
              ? `${dec.private_debounce_max_seconds} 秒`
              : "不封顶",
          ],
          ["判定带入前文", `${dec.context_messages} 条`],
          ["私聊直接回复", dec.always_reply_private ? "是" : "否"],
          ["被 @ 必回", dec.always_reply_when_mentioned ? "是" : "否"],
          ["焦点超时", `${focusCfg.timeout_minutes} 分钟`],
          ["主动发言需焦点", focusCfg.require_focus_for_say ? "是" : "否"],
        ].forEach(([key, value]) => grid.appendChild(paramBox(key, value)));
        el.list.appendChild(grid);

        if (data.sleep) {
          el.list.appendChild(sectionTitle("当前作息"));
          const sleepGrid = document.createElement("div");
          sleepGrid.className = "grid";
          [
            ["阶段", data.sleep.phase_label || data.sleep.phase],
            ["入睡", fmtClock(data.sleep.sleep_at)],
            ["起床", fmtClock(data.sleep.wake_at)],
            ["本轮推迟", `${data.sleep.postponed_hours || 0} 小时`],
          ].forEach(([key, value]) => sleepGrid.appendChild(paramBox(key, value)));
          el.list.appendChild(sleepGrid);
        }

        const patrol = data.patrol || {};
        const windows = patrol.windows || [];
        el.list.appendChild(sectionTitle("等待中的窗口"));
        if (!windows.length) {
          el.list.appendChild(emptyNode("当前没有正在计时的窗口"));
        }
        windows.forEach((item) => {
          const box = document.createElement("div");
          box.className = "item";
          const meta = document.createElement("div");
          meta.className = "meta";
          meta.appendChild(line(item.chat_label || item.chat_id, "who"));
          meta.appendChild(tag(item.silent ? "静默防抖" : "巡检窗口", item.silent ? "ok" : ""));
          if (item.mention) meta.appendChild(tag("含名字提及", "warn"));
          meta.appendChild(line(`剩余 ${fmtSeconds(item.remaining)}`));
          meta.appendChild(line(`本轮等待 ${fmtSeconds(item.delay)}`));
          box.appendChild(meta);
          el.list.appendChild(box);
        });

        const judging = patrol.judging || [];
        el.list.appendChild(sectionTitle("正在判定"));
        if (!judging.length) {
          el.list.appendChild(emptyNode("没有正在询问判定模型的会话"));
        }
        judging.forEach((item) => {
          const box = document.createElement("div");
          box.className = "item";
          const meta = document.createElement("div");
          meta.className = "meta";
          meta.appendChild(line(item.chat_label || item.chat_id, "who"));
          meta.appendChild(tag("判定中", "warn"));
          meta.appendChild(line("单次判定最长等待 30 秒"));
          box.appendChild(meta);
          el.list.appendChild(box);
        });

        const cooldowns = patrol.cooldowns || [];
        el.list.appendChild(sectionTitle("冷却中"));
        if (!cooldowns.length) {
          el.list.appendChild(emptyNode("没有被判为不回后静默的会话"));
        }
        cooldowns.forEach((item) => {
          const box = document.createElement("div");
          box.className = "item";
          const meta = document.createElement("div");
          meta.className = "meta";
          meta.appendChild(line(item.chat_label || item.chat_id, "who"));
          meta.appendChild(tag("冷却", "warn"));
          meta.appendChild(line(`剩余 ${fmtSeconds(item.remaining)}，期间普通消息不判定`));
          box.appendChild(meta);
          el.list.appendChild(box);
        });

        const focusItems = data.focus_items || [];
        el.list.appendChild(sectionTitle("会话焦点"));
        if (!focusItems.length) {
          el.list.appendChild(emptyNode("还没有任何会话获得过焦点"));
        }
        focusItems.forEach((item) => {
          const box = document.createElement("div");
          box.className = "item";
          const meta = document.createElement("div");
          meta.className = "meta";
          meta.appendChild(line(item.chat_label || item.chat_id, "who"));
          meta.appendChild(
            tag(
              FOCUS_STATUS[item.status] || item.status,
              item.status === "focused" ? "ok" : "warn"
            )
          );
          meta.appendChild(line(`最近活跃 ${fmtAge(item.focused_at)}`));
          meta.appendChild(line(`空闲 ${fmtSeconds(item.idle_seconds)}`));
          box.appendChild(meta);
          el.list.appendChild(box);
        });

        const lastDecisions = patrol.last_decisions || [];
        el.list.appendChild(sectionTitle("最近判定（每个会话最后一条）"));
        if (!lastDecisions.length) {
          el.list.appendChild(emptyNode("还没有判定记录"));
        }
        lastDecisions.forEach((item) => {
          const box = document.createElement("div");
          box.className = "item";
          const meta = document.createElement("div");
          meta.className = "meta";
          meta.appendChild(line(item.chat_label || item.chat_id, "who"));
          const good = item.verdict === "reply" || item.verdict === "release";
          meta.appendChild(
            tag(VERDICT_LABEL[item.verdict] || item.verdict, good ? "ok" : "warn")
          );
          meta.appendChild(tag(item.judged ? "模型判定" : "未调用模型"));
          meta.appendChild(line(`${fmtTime(item.at)} · ${fmtAge(item.at)}`));
          const body = document.createElement("div");
          body.className = "body";
          body.textContent = item.reason || "";
          box.append(meta, body);
          el.list.appendChild(box);
        });
      }

      function renderContextSessions(items) {
        el.contextChat.replaceChildren();
        const blank = document.createElement("option");
        blank.value = "";
        blank.textContent = items.length ? "选择会话" : "暂无会话";
        el.contextChat.appendChild(blank);
        items.forEach((item) => {
          const option = document.createElement("option");
          option.value = item.chat_id;
          const count = (item.counts && item.counts.contexts) || 0;
          option.textContent = `${item.chat_label || item.chat_id}（${count} 条上下文）`;
          el.contextChat.appendChild(option);
        });
      }

      // 当前上下文：逐字展示最近一次请求的内容——系统提示词、上下文条目、
      // 本轮消息、临时内容块。顺序即模型读取顺序。
      function renderContext(snap) {
        el.list.replaceChildren();
        if (!snap) {
          el.list.appendChild(emptyNode("该会话还没有捕获到主脑请求"));
          return;
        }
        const counts = snap.counts || {};
        const head = document.createElement("div");
        head.className = "item";
        const meta = document.createElement("div");
        meta.className = "meta";
        meta.appendChild(
          tag(
            snap.mode === "takeover" ? "接管上下文" : "原生按会话历史",
            snap.mode === "takeover" ? "warn" : "ok"
          )
        );
        meta.appendChild(line(`捕获于 ${fmtTime(snap.captured_at)} · ${fmtAge(snap.captured_at)}`));
        if (snap.model) meta.appendChild(tag(snap.model));
        meta.appendChild(
          line(
            `${counts.contexts || 0} 条上下文 · ${counts.extra_parts || 0} 个临时块 · ${counts.chars || 0} 字`
          )
        );
        if (counts.dropped_contexts > 0) {
          meta.appendChild(tag(`为控制体积省略了最早 ${counts.dropped_contexts} 条`, "warn"));
        }
        if (!snap.memory_enabled) meta.appendChild(tag("记忆停用", "warn"));
        if (!snap.schedule_enabled) meta.appendChild(tag("作息停用", "warn"));
        head.appendChild(meta);
        el.list.appendChild(head);

        el.list.appendChild(sectionTitle("系统提示词"));
        el.list.appendChild(textBlock(snap.system_prompt));

        el.list.appendChild(sectionTitle("上下文条目（按发送顺序）"));
        const contexts = snap.contexts || [];
        if (!contexts.length) el.list.appendChild(emptyNode("上下文为空"));
        contexts.forEach((entry) => {
          const box = document.createElement("div");
          box.className = "item";
          const entryMeta = document.createElement("div");
          entryMeta.className = "meta";
          entryMeta.appendChild(
            tag(
              ROLE_LABEL[entry.role] || entry.role || "未知",
              entry.role === "assistant" ? "" : "ok"
            )
          );
          if (entry.kind && entry.kind !== "history") {
            entryMeta.appendChild(line(ENTRY_KIND[entry.kind] || entry.kind));
          }
          const body = document.createElement("div");
          body.className = "body";
          body.textContent = entry.content || "（空）";
          box.append(entryMeta, body);
          el.list.appendChild(box);
        });

        el.list.appendChild(sectionTitle("本轮用户消息"));
        el.list.appendChild(textBlock(snap.prompt));

        el.list.appendChild(sectionTitle("临时内容块（随本轮发送，不写入历史）"));
        const extra = snap.extra_parts || [];
        if (!extra.length) el.list.appendChild(emptyNode("本轮没有临时内容块"));
        extra.forEach((part) => {
          const box = document.createElement("div");
          box.className = "item";
          const partMeta = document.createElement("div");
          partMeta.className = "meta";
          partMeta.appendChild(tag(part.label || "临时内容块", "warn"));
          const body = document.createElement("div");
          body.className = "body";
          body.textContent = part.content || "";
          box.append(partMeta, body);
          el.list.appendChild(box);
        });
      }

      function startEdit(body, actions, item) {
        const textarea = document.createElement("textarea");
        textarea.value = item.content;
        const toolbar = document.createElement("div");
        toolbar.className = "actions";
        const save = document.createElement("button");
        save.className = "primary";
        save.textContent = "保存";
        const cancel = document.createElement("button");
        cancel.textContent = "取消";
        toolbar.append(save, cancel);
        body.replaceWith(textarea);
        actions.replaceWith(toolbar);

        cancel.addEventListener("click", () => reload());
        save.addEventListener("click", async () => {
          const content = textarea.value.trim();
          if (!content) {
            setStatus("记忆内容不能为空", true);
            return;
          }
          save.disabled = true;
          cancel.disabled = true;
          try {
            await apiPost("memories/update", { id: item.id, content });
            await reload();
            setStatus("已保存修改");
          } catch (error) {
            setStatus(`保存失败：${error.message || error}`, true);
            save.disabled = false;
            cancel.disabled = false;
          }
        });
        textarea.focus();
      }

      async function deleteMemory(item) {
        const ok = confirm(
          `确定删除这条记忆？\n\n${item.content}\n\n删除后它不会在下一次压缩时被重新写回。`
        );
        if (!ok) return;
        try {
          await apiPost("memories/delete", { id: item.id });
          await reload();
          setStatus("已删除该条记忆");
        } catch (error) {
          setStatus(`删除失败：${error.message || error}`, true);
        }
      }

      function emptyNode(text) {
        const div = document.createElement("div");
        div.className = "empty";
        div.textContent = text;
        return div;
      }

      function renderPager() {
        const pages = Math.max(Math.ceil(state.total / PAGE_LIMIT), 1);
        const page = Math.floor(state.offset / PAGE_LIMIT) + 1;
        el.pageInfo.textContent = `第 ${page} / ${pages} 页 · 共 ${state.total} 条`;
        el.prev.disabled = state.offset <= 0;
        el.next.disabled = state.offset + PAGE_LIMIT >= state.total;
        el.pager.classList.toggle("hidden", state.total <= PAGE_LIMIT);
      }

      async function loadOverview() {
        renderStats(await apiGet("overview"));
      }

      async function loadChats() {
        renderChats(await apiGet("chats"));
      }

      async function loadList() {
        if (state.tab === "runtime") {
          renderRuntime(await apiGet("runtime"));
          state.total = 0;
          renderPager();
          return;
        }
        if (state.tab === "context") {
          await loadContext();
          return;
        }
        if (state.tab === "profiles") {
          const data = await apiGet("profiles", {
            limit: PAGE_LIMIT,
            offset: state.offset,
          });
          state.total = data.total || 0;
          renderProfiles(data.items || []);
          renderPager();
          return;
        }
        if (state.tab === "short") {
          // 摘要与消息一起取：页面展示的必须是时间线里真实存在的那批条目
          const [data, sums] = await Promise.all([
            apiGet("short_term", {
              chat_id: state.chatId,
              limit: PAGE_LIMIT,
              offset: state.offset,
            }),
            // 摘要跨会话，按会话筛选时就没有对应关系了，只在「全部会话」下展示
            state.chatId ? Promise.resolve({ items: [] }) : apiGet("summaries", { limit: PAGE_LIMIT }),
          ]);
          state.total = data.total || 0;
          renderShortTerm(data.items || [], sums.items || []);
          renderPager();
          return;
        }
        const data = await apiGet("memories", {
          tier: state.tab,
          limit: PAGE_LIMIT,
          offset: state.offset,
        });
        state.total = data.total || 0;
        renderMemories(data.items || []);
        renderPager();
      }

      // 当前上下文：先取会话列表，再取选中会话最近一次的完整快照。
      // 默认选最近被唤醒的那个，省掉「先选再找」的一步。
      async function loadContext() {
        const data = await apiGet("context");
        const items = data.items || [];
        state.total = 0;
        if (!items.length) {
          renderContextSessions([]);
          el.list.replaceChildren(
            emptyNode("还没有捕获到主脑请求。等她被唤醒一次后再刷新。")
          );
          renderPager();
          return;
        }
        if (
          !state.contextChatId ||
          !items.some((item) => item.chat_id === state.contextChatId)
        ) {
          state.contextChatId = items[0].chat_id;
        }
        renderContextSessions(items);
        el.contextChat.value = state.contextChatId;
        const snapshot = await apiGet("context", { chat_id: state.contextChatId });
        renderContext(snapshot);
        renderPager();
      }

      async function reload() {
        setStatus("载入中…");
        el.refresh.disabled = true;
        try {
          await Promise.all([loadOverview(), loadChats()]);
          await loadList();
          setStatus("");
        } catch (error) {
          console.error("[记忆页面]", error);
          setStatus(`载入失败：${error.message || error}`, true);
        } finally {
          el.refresh.disabled = false;
        }
      }

      el.refresh.addEventListener("click", reload);

      el.tabs.addEventListener("click", (event) => {
        const button = event.target.closest("button[data-tab]");
        if (!button) return;
        state.tab = button.dataset.tab;
        state.offset = 0;
        [...el.tabs.querySelectorAll("button")].forEach((item) =>
          item.classList.toggle("active", item === button)
        );
        // 会话筛选只对短期账本有意义；上下文有自己的会话选择器
        el.filters.classList.toggle("hidden", state.tab !== "short");
        el.contextFilters.classList.toggle("hidden", state.tab !== "context");
        reload();
      });

      el.chatFilter.addEventListener("change", () => {
        state.chatId = el.chatFilter.value;
        state.offset = 0;
        reload();
      });

      el.contextChat.addEventListener("change", () => {
        state.contextChatId = el.contextChat.value;
        setStatus("载入中…");
        loadContext()
          .then(() => setStatus(""))
          .catch((error) => setStatus(`载入失败：${error.message || error}`, true));
      });

      el.prev.addEventListener("click", () => {
        state.offset = Math.max(state.offset - PAGE_LIMIT, 0);
        loadList().catch((error) => setStatus(`载入失败：${error.message}`, true));
      });

      el.next.addEventListener("click", () => {
        state.offset += PAGE_LIMIT;
        loadList().catch((error) => setStatus(`载入失败：${error.message}`, true));
      });

      reload();
    </script>
  </body>
</html>
