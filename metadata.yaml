name: astrbot_plugin_shittim # 插件唯一识别名，以 astrbot_plugin_ 前缀开头
display_name: 什亭之枢
short_desc: 统一人格、跨会话记忆与主动行动，让智能体不再局限于单一会话，而是能够在所有私聊与群聊中共享同一人格与记忆。
logo: logo.png
desc: |
  一个让 AstrBot 智能体拥有全局状态、跨会话上下文与主动行动能力的插件。

  它让智能体不再局限于单一会话，而是能够在所有私聊与群聊中
  共享同一人格与记忆，自主决定向谁、在哪个会话说，以及说什么。

  主要特性：
  - 跨会话上下文池：所有会话共享同一人格记忆
  - 主动消息发送：LLM 可自主调用工具向任意私聊/群聊发送消息
  - 全局作息状态机：清醒/入睡中/浅睡/深睡四态跨所有会话共享
  - 入睡静默期：到点后若还有人跟她说话就重新计时，最多推迟两小时
  - 睡前道别与起床唤醒：入睡与醒来各唤起一次主脑，由她决定说不说、对谁说
  - 睡眠期拦放与叫醒、睡眠期消息暂存
  - 全局时间线：所有会话共享连续认知，默认以临时块注入，可选整体接管上下文
  - 三层记忆与位置榜：榜前按「最近被想起」排序，尾部逐级变模糊直至遗忘
  - 态度层：记忆不止陈述，还记住她对某个人、某件事的第一人称看法；看法会被新证据改写，只会淡化不会遗忘
  - 用户画像：以 QQ 号识别同一个人，跨私聊与群聊积累名字、兴趣与观点；观察与态度分开，关系强度缓慢回归
  - 时间词自动换算：说「昨天」「上周三」「上个月」时由插件算出日期区间，按那段时间取回记忆
  - 联想式注入：不用主动调工具，插件替她想起与眼前话题有关的人与事，并附上她当时的看法
  - 短期记忆自动压缩：条目超阈值压成摘要，深睡期收口成当天摘要并清空账本
  - 深睡期记忆整理：压缩 / 树状收口 / 名次降级 / 阶梯遗忘 / 清空账本
  - 判定理由传递：放行的原因以「自己刚冒出的念头」交给主脑，可被驳回并转为沉默
  - 巡检冷却：判为不开口或主脑收回发言后，该会话安静一段时间；@、私聊与名字提及可穿透
  - 同一时刻只说一处：私聊与群聊同时来消息时，只有一轮主脑在说话，另一条排队等待
  - 走进会话：先看离开期间攒下的未读再决定说不说，走进去后的话直接说在那里
  - 工具清单常驻：全部工具与用法每轮注入上下文，按本轮真实可用的工具裁剪
  - 当前处境注入：会话标签与群号、自己的账号、@ 归属、图片与转发的转述性质都由插件作为事实提供
