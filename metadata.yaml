name: astrbot_plugin_shittim # 插件唯一识别名，以 astrbot_plugin_ 前缀开头
display_name: 什亭之枢
desc: |
  什亭之枢（Shittim）是一个让 AstrBot 智能体拥有全局状态、
  跨会话上下文与主动行动能力的插件。

  它让智能体不再局限于单一会话，而是能够在所有私聊与群聊中
  共享同一人格与记忆，自主决定向谁、在哪个会话说，以及说什么。

  主要特性：
  - 跨会话上下文池：所有会话共享同一人格记忆
  - 主动消息发送：LLM 可自主调用工具向任意私聊/群聊发送消息
  - 全局作息状态机：清醒/浅睡/深睡三态跨所有会话共享
  - 睡眠期拦放与叫醒、睡眠期消息暂存
  - 全局时间线：所有会话按时间排成同一条脉络，切会话不换上下文
  - 三层记忆与位置榜：榜前按「最近被想起」排序，尾部逐级变模糊直至遗忘
  - 短期记忆自动压缩：条目超阈值压成摘要，深睡期收口成当天摘要并清空账本
  - 深睡期记忆整理：压缩 / 树状收口 / 名次降级 / 阶梯遗忘 / 清空账本
version: v1.3.0 # 插件版本号
author: SouthThink # 作者
repo: https://github.com/SouthThink/astrbot_plugin_shittim # 插件的仓库地址
astrbot_version: ">=4.17.0"
support_platforms:
  - aiocqhttp
tags:
  - agent
  - memory
  - proactive
  - qq
